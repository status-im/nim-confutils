name: CI
on:
  push:
    branches:
      - master
      - test-minver
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: status-im/nimbus-common-workflow/.github/workflows/common.yml@minver
    with:
      install-command: 'nimble --resolver:minver install -y --depsOnly'
      test-command: |
        nimble --useSystemNim install -y --depsOnly toml_serialization json_serialization unittest2
        nimble list --installed --version
        rm -f nimble.lock
        nimble test
